name: Build ServerUtils
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn clean package --batch-mode
      - uses: actions/upload-artifact@v4
        with:
          name: ServerUtils
          path: target/*.jar
